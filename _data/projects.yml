# Add one entry per project. `image` is a path under /assets/img/projects/
# (drop the file there) or a full https:// URL to an image hosted elsewhere.
#
# primary_roles is a list (add/remove "- Role" lines freely).
# description is a short blurb about the game itself; blurb is about your contributions.
# result is optional -- delete the line entirely if a project has nothing to report.
# gdd_url is optional too -- points at a PDF you've dropped in /assets/docs/.
- name: "Lifting Spirits - Macrow Spring Jam 2026"
  itch_url: "https://table3games.itch.io/lifting-spirits"
  image: "/assets/img/projects/thumbnail1.png"
  primary_roles:
    - Director
    - Producer
    - Game/Level Designer
    - Additional Programmer
  description: >
    An up-scrolling climbing platformer about Lua, a wingless fairy scaling the ailing Great Tree to help
    her best friend heal it and rediscover hope. Along the way, meet friendly spirits who will aid
    your ascent.
  blurb: >
    During an intensive two-week game jam, I led a five-person multidisciplinary team, working
    alongside an artist, a programmer, a composer and sound designer, and a narrative writer. In
    addition to designing the gameplay and levels, I coordinated workflows and deliverables,
    maintained creative alignment using a detailed game
    design document, and oversaw the integration and polish of each component. The finished game
    received overwhelmingly positive feedback.
  result: "3rd place out of 209 submissions"
  gdd_url: "/assets/docs/lifting-spirits-gdd.pdf"

- name: "Trash Panda - Godot Wild Jam #89"
  itch_url: "https://pasta-town.itch.io/trash-panda"
  image: "/assets/img/projects/thumbnail2.png"
  primary_roles:
    - Director
    - Producer
    - Game/Level Designer
    - Narrative/Script Writer
  description: >
    A narrative-driven 2D puzzle-platformer about a raccoon pursuing the better life all raccoons
    deserve. Armed with a wad of chewing gum, float, stick, and whip through the suburbs while
    discovering what life is really about.
  blurb: >
    Trash Panda was my first experience taking a game from conception to submission. During a
    nine-day jam, I partnered with a programmer friend to build an ambitious platformer featuring
    multiple mechanics and settings. I designed levels and gameplay while filling whatever gaps
    the project demanded, including sourcing visual and audio assets and writing dialogue. Our
    scope exceeded what two people could fully polish in nine days, but the
    experience taught me invaluable lessons about prioritization and adaptability. The finished
    game retained a distinct charm that reflected the passion we brought to making it.
  result: "22nd place out of 137 submissions in <em>Fun</em> category"

